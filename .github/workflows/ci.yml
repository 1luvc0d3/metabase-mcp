name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # "edited" re-runs the PR title check when the title changes
    types: [opened, synchronize, reopened, edited]
  # Manual re-runs (e.g. if GitHub drops a push event)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  # Builds the image and checks it starts, answers /health, and enforces auth
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t metabase-mcp:ci .

      - name: Refuses to start without auth tokens
        run: |
          if out=$(docker run --rm -e METABASE_URL=http://metabase.invalid -e METABASE_API_KEY=x metabase-mcp:ci 2>&1); then
            echo "::error::container started on 0.0.0.0 without auth"; exit 1
          fi
          echo "$out" | grep -q "Refusing to listen" || { echo "$out"; echo "::error::container failed for another reason"; exit 1; }

      - name: Starts with tokens and enforces them
        run: |
          docker run -d --name mcp -p 3000:3000 \
            -e METABASE_URL=http://metabase.invalid -e METABASE_API_KEY=x \
            -e MCP_AUTH_TOKENS=ci:ci-token-0123456789 metabase-mcp:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/mcp)
          test "$status" = 401 || { echo "::error::expected 401 without token, got $status"; exit 1; }
          test "$(docker inspect -f '{{.Config.User}}' mcp)" = node

      - name: Container logs
        if: always()
        run: docker logs mcp || true

  # PRs are squash-merged and the PR title becomes the commit on main, which release-please
  # reads to decide the next version. Skipped (and so passing) outside pull_request events.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|deps)(\([a-z0-9._/-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add X', 'fix(client): handle Y', 'docs: update Z'. Got: $TITLE"
            exit 1
          fi
