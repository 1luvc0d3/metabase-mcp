# Turns on auto-merge (squash) for Dependabot PRs that only touch dev dependencies at minor or
# patch level. GitHub merges them once the required checks pass. Everything else (runtime
# dependencies, majors, GitHub Actions) waits for a human.
#
# Note: a merge made with GITHUB_TOKEN doesn't trigger push workflows on main, so release-please
# picks these commits up on the next human merge. They're chore(deps-dev) and never release.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      - name: Decide
        id: decide
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          echo "$DEPS" | jq -r '.[] | "\(.dependencyName) \(.dependencyType) \(.updateType)"'
          # Every dependency in the PR (grouped PRs carry several) must be a direct dev
          # dependency with a non-major update.
          ok=$(echo "$DEPS" | jq 'length > 0 and all(.[]; .dependencyType == "direct:development" and .updateType != "version-update:semver-major")')
          echo "eligible=$ok" >> "$GITHUB_OUTPUT"
          echo "Auto-merge eligible: $ok"

      - name: Enable auto-merge
        if: steps.decide.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
