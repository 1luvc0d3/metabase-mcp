# Release pipeline. Keep this filename: npm trusted publishing (OIDC) is bound to it.
#
# On every push to main, release-please keeps a "chore(main): release X.Y.Z" PR up to date
# from the Conventional Commit titles merged since the last release. Merging that PR tags the
# release, and the publish job below ships it to npm, the GitHub release (.mcpb) and the
# official MCP registry.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # Uses a fine-grained PAT (Contents + Pull requests: read & write, this repo only), not
      # GITHUB_TOKEN: PRs and pushes made with GITHUB_TOKEN don't trigger pull_request
      # workflows, so the release PR would never get its required checks. Running CI via
      # workflow_dispatch doesn't help either, because GitHub doesn't count those checks for
      # the PR. If the token expires, release-please fails here: rotate RELEASE_PLEASE_TOKEN.
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      PACKAGE: '@ai-1luvc0d3/metabase-mcp'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (required for OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Build .mcpb bundle
        run: npm run build:mcpb

      - name: Upload .mcpb to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" metabase-mcp-*.mcpb

      # The registry validates mcpName by fetching the package from npm, which can take a few
      # minutes to serve a new version.
      - name: Wait for npm to serve the new version
        run: |
          for _ in $(seq 1 40); do
            if curl -sf "https://registry.npmjs.org/${PACKAGE}/${VERSION}" > /dev/null; then
              echo "npm is serving ${PACKAGE}@${VERSION}"; exit 0
            fi
            sleep 15
          done
          echo "::error::npm did not serve ${PACKAGE}@${VERSION} within 10 minutes"; exit 1

      - name: Publish to the official MCP registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
