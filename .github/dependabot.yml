# Dependency updates. PR titles must pass the pr-title check (Conventional Commits) and are read
# by release-please on squash merge:
#   fix(deps): ...       runtime dependencies  -> patch release, so users get the update
#   chore(deps-dev): ... dev dependencies      -> no release
#   ci(deps): ...        GitHub Actions        -> no release
# Groups are split by update type so each PR is either auto-mergeable or not: dev minor/patch,
# runtime patch and actions minor/patch auto-merge once the required checks pass (rules in
# .github/scripts/auto-merge-eligible.sh); runtime minor and all majors wait for a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      runtime-patch:
        dependency-type: production
        update-types: [patch]
      runtime-minor:
        dependency-type: production
        update-types: [minor]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      # Security updates arrive any day of the week; group them the same way.
      runtime-security:
        applies-to: security-updates
        dependency-type: production
      dev-security:
        applies-to: security-updates
        dependency-type: development
    # Major versions open one PR each and always need a human (e.g. zod 3 -> 4 is a migration).
    ignore:
      # Types must match the oldest supported Node (engines: >=22.12); bump with the engines field.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ESLint 10 needs a config migration; do it deliberately rather than via Dependabot.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # typescript-eslint 8.x supports TypeScript < 6.1 only (#78). Drop this once it supports 7.
      - dependency-name: typescript
        versions: ['>=7.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
      actions-major:
        patterns: ['*']
        update-types: [major]
